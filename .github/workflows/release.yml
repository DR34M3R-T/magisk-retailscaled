name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      bump:
        type: choice
        description: 'Module version bump type'
        options:
          - none
          - major
          - minor
          - patch
          - build
        default: 'patch'
      tailscale_version:
        type: string
        description: 'Upstream tailscale/tailscale version (e.g. 1.104.7 or latest)'
        default: 'latest'
      release_notes:
        type: string
        description: 'Optional custom release summary / highlights (Markdown supported)'
        default: ''

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build tools (UPX & jq)
        run: |
          sudo apt-get update
          sudo apt-get install -y upx-ucl jq zip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Bump version
        if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
        run: |
          chmod +x .github/tools/*.sh
          ./.github/tools/version-bump.sh "${{ inputs.bump }}"

      - name: Sync version from tag
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          BASE_NUM=$(echo "$TAG_VERSION" | sed 's/^v//; s/-.*//')
          IFS='.' read -r MAJOR MINOR PATCH BUILD <<< "$BASE_NUM"
          VERSION_CODE=$(printf "%02d%02d%02d%02d" "$MAJOR" "$MINOR" "$PATCH" "${BUILD:-0}")
          sed -i "s/^version=.*/version=$TAG_VERSION/" module.prop
          sed -i "s/^versionCode=.*/versionCode=$VERSION_CODE/" module.prop

      - name: Cross-compile upstream Tailscale for Android
        id: tailscale
        env:
          TAILSCALE_VERSION: ${{ inputs.tailscale_version || 'latest' }}
        run: |
          chmod +x .github/tools/*.sh
          ./.github/tools/build-tailscale.sh tailscale/bin dist
          echo "ts_version=$(cat dist/tailscale-version.txt)" >> "$GITHUB_OUTPUT"

      - name: Compute release tag with Tailscale version
        id: version
        run: |
          TS_VER="${{ steps.tailscale.outputs.ts_version }}"
          RAW_VER=$(grep '^version=' module.prop | cut -d'=' -f2)
          BASE_VER=$(echo "$RAW_VER" | sed 's/-ts.*//')
          if [ "${{ github.event_name }}" = "push" ]; then
            FULL_TAG="${GITHUB_REF#refs/tags/}"
          else
            FULL_TAG="${BASE_VER}-ts${TS_VER}"
          fi
          sed -i "s/^version=.*/version=${FULL_TAG}/" module.prop

          echo "version=${FULL_TAG}" >> "$GITHUB_OUTPUT"
          BUILD=$(echo "$BASE_VER" | sed 's/^v//' | cut -d'.' -f4)
          if [ "${BUILD:-0}" != "0" ]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build REtailscaled Release APK
        working-directory: gui
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.keystore"
            echo "Using release keystore from GitHub Secrets."
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; falling back to ephemeral debug signing."
          fi
          ./gradlew assembleRelease --no-daemon

      - name: Package Magisk Module Zips
        run: ./.github/tools/build.sh "${{ steps.version.outputs.version }}"

      - name: Generate release notes
        env:
          CUSTOM_NOTES: ${{ inputs.release_notes || '' }}
          FULL_VER: ${{ steps.version.outputs.version }}
          TS_VER: ${{ steps.tailscale.outputs.ts_version }}
          REPO: ${{ github.repository }}
        run: |
          chmod +x .github/tools/*.sh
          PREV_TAG=$(git tag --sort=-creatordate | grep -vxF "$FULL_VER" | head -n 1 || true)
          CHANGES=$(./.github/tools/generate-notes.sh "$FULL_VER")
          {
            if [ -n "$CUSTOM_NOTES" ]; then
              echo "## Highlights"
              echo ""
              printf "%s\n\n" "$CUSTOM_NOTES"
            fi
            echo "## What's Changed"
            echo ""
            printf "%s\n" "$CHANGES"
            if [ -n "$PREV_TAG" ]; then
              echo "**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${FULL_VER}"
              echo ""
            fi
            echo "## Included Components"
            echo "- **Upstream Tailscale**: [tailscale/tailscale v${TS_VER}](https://github.com/tailscale/tailscale/releases/tag/v${TS_VER}) (static \`linux/arm64\` & \`linux/arm\` for Android, \`ts_include_cli\`, UPX-compressed)"
            echo "- **REtailscaled App (\`io.github.dr34m3rt.retailscaled\`)**: Material 3 Jetpack Compose control app + Quick Settings Tile (automatically installed on module flash, communicates via zero-Root local bridge)"
            echo "- **Default Mode**: \`userspace-networking\` + local SOCKS5 (\`127.0.0.1:1055\`), zero conflict with FlClash / Android VPNs."
            echo ""
            echo "## Downloads"
            echo "- **Magisk-REtailscaled-${FULL_VER}-full.zip** — Recommended offline package (includes \`tailscaled\`, \`tailscaled-bridge\`, \`jq\`, and \`REtailscaled.apk\`)"
            echo "- **Magisk-REtailscaled-${FULL_VER}.zip** — Lightweight package (downloads binaries on install)"
            echo "- **REtailscaled-${FULL_VER}.apk** — Companion GUI APK"
          } > dist/release-notes.md

      - name: Create Release
        id: release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: Magisk REtailscaled ${{ steps.version.outputs.version }}
          files: |
            dist/Magisk-REtailscaled-*.zip
            dist/REtailscaled-*.apk
            dist/tailscale_*.tgz
          body_path: dist/release-notes.md
          generate_release_notes: false
          prerelease: ${{ steps.version.outputs.prerelease }}

      - name: Update JSON with release URLs
        env:
          ASSETS: ${{ steps.release.outputs.assets }}
        run: |
          FULL_VER="${{ steps.version.outputs.version }}"
          ZIP_URL=$(echo '${{ steps.release.outputs.assets }}' | jq -r '.[] | select(.name | endswith("-full.zip")) | .browser_download_url')
          for json_file in update.json update-arm.json update-arm64.json; do
            jq --arg v "$FULL_VER" --arg url "$ZIP_URL" '.version = $v | .zipUrl = $url' "$json_file" > "${json_file}.tmp" && mv "${json_file}.tmp" "$json_file"
          done

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add module.prop update*.json CHANGELOG.md
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Bump version to ${{ steps.version.outputs.version }}"
            if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
              git push
            fi
          fi
